<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adham & Salma | Wedding Invitation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="intro" class="intro">
    <img class="cover" src="assets/invitation-cover.png" alt="Adham & Salma Wedding Invitation" />

    <!-- Visual transition built from the supplied cover image -->
    <div class="couple-layer" aria-hidden="true">
      <div class="person groom"><img src="assets/invitation-cover.png" alt="" /></div>
      <div class="person bride"><img src="assets/invitation-cover.png" alt="" /></div>
    </div>

    <button id="openInvitation" type="button">OPEN INVITATION <span>→</span></button>
  </main>

  <section id="weddingContent" class="wedding-content">
    <div class="page-card">
      <p class="eyebrow">TOGETHER WITH THEIR FAMILIES</p>
      <h1>Adham <span>&amp;</span> Salma</h1>
      <p class="invite">INVITE YOU TO CELEBRATE THEIR MARRIAGE</p>
      <div class="details">
        <div><strong>DECEMBER 12, 2026</strong></div>
        <div>8:00 PM – 12:00 AM</div>
        <div class="venue">Four Seasons Hotel Cairo at Nile Plaza<br />Plaza Ballroom</div>
        <div>1089 Nile Corniche, Garden City, Cairo</div>
      </div>
      <a class="location" href="https://maps.google.com/?q=Four+Seasons+Hotel+Cairo+at+The+First+Residence" target="_blank" rel="noopener">VIEW LOCATION</a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
